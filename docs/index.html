<p>今日磷酸铁锂行业聚焦三大主线：一是8C快充铁锂电池进入量产冲刺期，头部厂商已发布峰值10C、10%-80%充电5.25分钟的参数，快充性能竞争白热化；二是钛能化学宣布110亿元投向磷酸铁与钛白粉一体化项目，行业扩产热度不减；三是工信部对废旧动力电池回收政策踩下“急刹车”，叠加碳酸锂产线停产检修，上游供给收缩信号增强。政策端，超快充技术标准与湖北下一代电池布局值得关注。整体看，行业处于技术升级与产能扩张并行、政策规范趋严的窗口期。</p>
