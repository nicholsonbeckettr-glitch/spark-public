<p>湖南裕能上半年净利暴增853.51%，高压实磷酸铁锂正极材料已稳定量产，压实密度达2.6g/cm³以上，具备6C快充等优势，储能占比提升。公司赴港递表，但比亚迪、宁德时代此前减持。行业层面，动力电池回收政策2026年落地，宜宾世界动力电池大会将于9月召开。整体看，高压实产品放量带动盈利修复，但需关注大客户减持与回收政策对行业格局的影响。</p>
